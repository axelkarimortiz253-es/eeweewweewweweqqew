<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de alumnos</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root {
            --ink: #17191c;
            --paper: #f5f1e8;
            --yellow: #e8ff38;
            --orange: #ff5b35;
            --cyan: #39d6d5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background:
                linear-gradient(135deg, transparent 70%, rgb(232 255 56 / 25%) 70%),
                repeating-linear-gradient(90deg, #dcd8ce 0 1px, transparent 1px 42px),
                var(--paper);
            color: var(--ink);
            font-family: "Arial Black", Impact, system-ui, sans-serif;
        }

        #app {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 18px;
        }

        .shell {
            position: relative;
            width: min(980px, 100%);
            display: grid;
            grid-template-columns: 0.82fr 1.18fr;
            gap: 22px;
        }

        .panel {
            position: relative;
            border: 4px solid var(--ink);
            background: #fff;
            box-shadow: 12px 12px 0 var(--ink);
        }

        .form-panel {
            padding: 28px;
        }

        .form-panel::before,
        .list-panel::before {
            content: "";
            position: absolute;
            z-index: -1;
            background: var(--yellow);
        }

        .form-panel::before {
            width: 180px;
            height: 38px;
            right: -38px;
            top: -20px;
            transform: rotate(-4deg);
        }

        .list-panel {
            min-height: 520px;
            padding: 24px;
            background: #24272d;
            color: #fff;
        }

        .list-panel::before {
            width: 74px;
            height: 74px;
            right: -26px;
            bottom: -26px;
            transform: rotate(45deg);
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 8px;
            padding: 5px 9px;
            transform: rotate(-2deg);
            background: var(--ink);
            color: var(--yellow);
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1,
        h2 {
            margin: 0;
            text-transform: uppercase;
        }

        h1 {
            max-width: 360px;
            font-size: clamp(2rem, 5vw, 4.2rem);
            line-height: 0.88;
            letter-spacing: -0.06em;
        }

        h2 {
            margin-bottom: 18px;
            color: var(--yellow);
            font-size: 1.25rem;
        }

        form {
            display: grid;
            gap: 14px;
            margin-top: 28px;
        }

        label {
            display: grid;
            gap: 7px;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            border: 3px solid var(--ink);
            border-radius: 0;
            outline: none;
            background: var(--paper);
            padding: 13px 14px;
            color: var(--ink);
            font: 800 1rem/1 Arial, sans-serif;
        }

        input:focus {
            background: #fff;
            box-shadow: 5px 5px 0 var(--cyan);
        }

        button {
            min-height: 52px;
            border: 3px solid var(--ink);
            background: var(--orange);
            color: #fff;
            font: 900 1rem/1 "Arial Black", Impact, sans-serif;
            text-transform: uppercase;
            cursor: pointer;
            clip-path: polygon(0 0, 94% 0, 100% 30%, 100% 100%, 6% 100%, 0 70%);
            transition: transform 120ms ease, box-shadow 120ms ease;
        }

        button:hover {
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0 var(--ink);
        }

        .empty {
            min-height: 380px;
            display: grid;
            place-items: center;
            border: 2px dashed #737780;
            color: #aeb2bb;
            text-align: center;
            text-transform: uppercase;
        }

        .student-list {
            display: grid;
            gap: 12px;
        }

        .student {
            display: grid;
            grid-template-columns: 58px 1fr;
            align-items: center;
            min-height: 82px;
            border: 3px solid #fff;
            background: #343840;
            box-shadow: 6px 6px 0 var(--yellow);
        }

        .student-number {
            height: 100%;
            display: grid;
            place-items: center;
            background: var(--cyan);
            color: var(--ink);
            font-size: 1.45rem;
        }

        .student-info {
            padding: 12px 14px;
        }

        .student-name {
            display: block;
            font-size: 1.05rem;
            text-transform: uppercase;
        }

        .student-meta {
            display: block;
            margin-top: 5px;
            color: #c7cad1;
            font-family: Arial, sans-serif;
            font-size: 0.84rem;
            font-weight: 700;
        }

        @media (max-width: 760px) {
            .shell {
                grid-template-columns: 1fr;
            }

            .list-panel {
                min-height: 320px;
            }

            .empty {
                min-height: 220px;
            }

            .panel {
                box-shadow: 8px 8px 0 var(--ink);
            }
        }
    </style>
</head>
<body>
    <main id="app">
        <div class="shell">
            <section class="panel form-panel">
                <span class="eyebrow">NUEVO AGENTE</span>
                <h1>Registro de alumnos</h1>

                <form @submit.prevent="registrarAlumno">
                    <label>
                        Nombre
                        <input v-model.trim="nombre" type="text" placeholder="Nombre completo">
                    </label>

                    <label>
                        Edad
                        <input v-model.number="edad" type="number" min="1" max="100" placeholder="Ej. 18">
                    </label>

                    <label>
                        Especialidad
                        <input v-model.trim="especialidad" type="text" placeholder="Ej. Diseño digital">
                    </label>

                    <button type="submit">Registrar alumno</button>
                </form>
            </section>

            <section class="panel list-panel">
                <h2>Lista activa // {{ alumnos.length }}</h2>

                <div v-if="alumnos.length === 0" class="empty">
                    Sin registros
                </div>

                <div v-else class="student-list">
                    <article v-for="(alumno, index) in alumnos" :key="index" class="student">
                        <span class="student-number">{{ String(index + 1).padStart(2, '0') }}</span>
                        <div class="student-info">
                            <strong class="student-name">{{ alumno.nombre }}</strong>
                            <span class="student-meta">{{ alumno.edad }} años · {{ alumno.especialidad }}</span>
                        </div>
                    </article>
                </div>
            </section>
        </div>
    </main>

    <script src="alumno.js"></script>
</body>
</html>
